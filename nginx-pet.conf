server {
  listen 80;
  server_name _;
  root /var/www/ai-pose-pet/dist;
  index index.html;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pet-api/ {
    rewrite ^/pet-api/(.*)$ /$1 break;
    proxy_pass https://ai-pose-pet-api.chengevip.com;
    proxy_ssl_server_name on;
    proxy_ssl_name ai-pose-pet-api.chengevip.com;
    proxy_set_header Host ai-pose-pet-api.chengevip.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
